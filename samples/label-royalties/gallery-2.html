<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Gallery</title><style>:root{--ink:#17212b;--muted:#5d6b78;--panel:#f3f6f8;--rule:#dfe5ea;--accent:#0e6e6a;--bad:#b3261e}
*{box-sizing:border-box}
html,body{margin:0;width:1280px;height:769px;background:#fff;color:var(--ink);font-family:"Segoe UI",Arial,sans-serif}
.wrap{height:100%;padding:64px 90px 90px;display:flex;flex-direction:column;gap:34px}
.eyebrow{font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-size:56px;line-height:1.08;margin:0;letter-spacing:-.02em;max-width:1050px}
.tag{position:absolute;left:90px;bottom:40px;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:30px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:21px;color:var(--muted);font-weight:600;padding:0 14px 12px;border-bottom:2px solid var(--rule)}
td{padding:13px 14px;border-bottom:1px solid var(--rule)}
th.n,td.n{text-align:right}
td.bad{color:var(--bad);font-weight:700}
td.total{font-weight:800}
.panel{background:var(--panel);border-radius:26px;padding:40px 48px}
code{font-family:Consolas,"Cascadia Mono",monospace;font-size:26px;white-space:nowrap;color:var(--ink)}
.note{font-size:30px;line-height:1.35;color:var(--ink);max-width:1080px}
.muted{color:var(--muted)}
.opts{display:flex;gap:22px;flex-wrap:wrap}
.opt{border:2px solid var(--rule);border-radius:18px;padding:16px 24px;font-size:28px}
.opt b{color:var(--accent)}
ul.list{margin:0;padding:0;list-style:none;display:grid;gap:14px;font-size:30px}
ul.list li{display:flex;justify-content:space-between;gap:30px;border-bottom:1px solid var(--rule);padding-bottom:12px}
ul.list li span.n{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}</style></head><body><div class="wrap"><div class="eyebrow">The advance, quarter by quarter</div><h1>Recouped a quarter earlier than the label says</h1><div style="margin-top:6px"><svg viewBox="0 0 1100 380" width="100%" role="img" aria-label="Advance balance by quarter"><line x1="70" x2="1070" y1="336.0" y2="336.0" stroke="#e3e8ec"/><text x="62" y="340.0" text-anchor="end" font-size="15" fill="#5d6b78">€0k</text><line x1="70" x2="1070" y1="232.0" y2="232.0" stroke="#e3e8ec"/><text x="62" y="236.0" text-anchor="end" font-size="15" fill="#5d6b78">€5k</text><line x1="70" x2="1070" y1="128.0" y2="128.0" stroke="#e3e8ec"/><text x="62" y="132.0" text-anchor="end" font-size="15" fill="#5d6b78">€10k</text><line x1="70" x2="1070" y1="24.0" y2="24.0" stroke="#e3e8ec"/><text x="62" y="28.0" text-anchor="end" font-size="15" fill="#5d6b78">€15k</text><text x="70.0" y="358" text-anchor="middle" font-size="15" fill="#5d6b78">advance</text><text x="236.7" y="358" text-anchor="middle" font-size="15" fill="#5d6b78">2025 Q1</text><text x="403.3" y="358" text-anchor="middle" font-size="15" fill="#5d6b78">2025 Q2</text><text x="570.0" y="358" text-anchor="middle" font-size="15" fill="#5d6b78">2025 Q3</text><text x="736.7" y="358" text-anchor="middle" font-size="15" fill="#5d6b78">2025 Q4</text><text x="903.3" y="358" text-anchor="middle" font-size="15" fill="#5d6b78">2026 Q1</text><text x="1070.0" y="358" text-anchor="middle" font-size="15" fill="#5d6b78">2026 Q2</text><polyline points="70.0,24.0 236.7,24.0 403.3,100.8 570.0,149.9 736.7,227.7 903.3,293.5 1070.0,336.0" fill="none" stroke="#b3261e" stroke-width="3" stroke-dasharray="7 5"/><circle cx="70.0" cy="24.0" r="4" fill="#b3261e"/><circle cx="236.7" cy="24.0" r="4" fill="#b3261e"/><circle cx="403.3" cy="100.8" r="4" fill="#b3261e"/><circle cx="570.0" cy="149.9" r="4" fill="#b3261e"/><circle cx="736.7" cy="227.7" r="4" fill="#b3261e"/><circle cx=
