<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Shopify Quarter Cover</title>
<style>
:root{--ink:#17212b;--muted:#5d6b78;--panel:#f3f6f8;--accent:#0e6e6a}
*{box-sizing:border-box}html,body{margin:0;width:1280px;height:769px;background:#fff;color:var(--ink);font-family:"Segoe UI",Arial,sans-serif}
.wrap{height:100%;padding:80px 90px;display:grid;grid-template-columns:1.35fr 1fr;align-items:center;gap:60px}
h1{font-size:86px;line-height:1.02;margin:0;letter-spacing:-.025em}
.card{background:var(--panel);border-radius:28px;padding:56px 40px;text-align:center}
.big{font-size:150px;font-weight:800;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.lab{font-size:34px;margin-top:14px;color:var(--ink)}
.tag{position:absolute;left:90px;bottom:48px;font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
</style></head><body><div class="wrap">
<h1>Your Shopify quarter, every number recomputed</h1>
<div class="card"><div class="big">36/36</div><div class="lab">figures match</div></div>
</div><div class="tag">Sample</div></body></html>
