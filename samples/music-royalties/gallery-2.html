<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Gallery</title><style>:root{--ink:#17212b;--muted:#5d6b78;--panel:#f3f6f8;--rule:#dfe5ea;--accent:#0e6e6a;--bad:#b3261e}
*{box-sizing:border-box}
html,body{margin:0;width:1280px;height:769px;background:#fff;color:var(--ink);font-family:"Segoe UI",Arial,sans-serif}
.wrap{height:100%;padding:64px 90px 90px;display:flex;flex-direction:column;gap:34px}
.eyebrow{font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-size:56px;line-height:1.08;margin:0;letter-spacing:-.02em;max-width:1050px}
.tag{position:absolute;left:90px;bottom:40px;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:30px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:21px;color:var(--muted);font-weight:600;padding:0 14px 12px;border-bottom:2px solid var(--rule)}
td{padding:13px 14px;border-bottom:1px solid var(--rule)}
th.n,td.n{text-align:right}
td.bad{color:var(--bad);font-weight:700}
td.total{font-weight:800}
.panel{background:var(--panel);border-radius:26px;padding:40px 48px}
code{font-family:Consolas,"Cascadia Mono",monospace;font-size:26px;white-space:nowrap;color:var(--ink)}
.note{font-size:30px;line-height:1.35;color:var(--ink);max-width:1080px}
.muted{color:var(--muted)}
.opts{display:flex;gap:22px;flex-wrap:wrap}
.opt{border:2px solid var(--rule);border-radius:18px;padding:16px 24px;font-size:28px}
.opt b{color:var(--accent)}
ul.list{margin:0;padding:0;list-style:none;display:grid;gap:14px;font-size:30px}
ul.list li{display:flex;justify-content:space-between;gap:30px;border-bottom:1px solid var(--rule);padding-bottom:12px}
ul.list li span.n{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}</style></head><body><div class="wrap"><div class="eyebrow">Were we paid right</div><h1>Every reported dollar arrived. Four things did not.</h1><ul class="list"><li>Apple Music never reported February<span class="n">≈ $467</span></li><li>Deezer's February reported twice<span class="n">+$95.15</span></li><li>Spotify took streams back as artificial<span class="n">−$191.52</span></li><li>May converted 3.1% below the reference rate<span class="n">−€19.03</span></li></ul></div><div class="tag">Case · synthetic band</div></body></html>
